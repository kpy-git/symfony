# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    kpy.base_domain: '%env(BASE_DOMAIN)%'

    kpy.feeds_dir: '%kernel.project_dir%/var/feeds'

    connectif.log_dir: '%kernel.logs_dir%/connectif'

    kpy.google.var_dir: '%kernel.project_dir%/var/google'
    kpy.google.feed_dir: '%kpy.feeds_dir%/google'

    kpy.priceshape.var_dir: '%kpy.feeds_dir%/priceshape'

    kpy.warehouse.var_dir: '%kernel.project_dir%/var/warehouse'
    kpy.warehouse.ownership_manipulation_cost: '%env(float:OWNERSHIP_WAREHOUSE_MANIPULATION_COST)%'
    kpy.warehouse.neftys_commission: '%env(float:NEFTYS_COMMISSION)%'
    kpy.warehouse.evolution_pets_fulfillment_cost: '%env(float:EVOLUTION_PETS_FULFILLMENT_COST)%'
    kpy.warehouse.distrivet_fulfillment_cost: '%env(float:DISTRIVET_FULFILLMENT_COST)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

        bind:
            $environment: '%kernel.environment%'

            $aquaDSN: '%env(AQUA_DSN)%'
            $aquaUser: '%env(AQUA_USER)%'
            $aquaPassword: '%env(AQUA_PASSWORD)%'

            $kompyDbUser: '%env(KOMPY_DB_USER)%'
            $kompyDbPassword: '%env(KOMPY_DB_PASSWORD)%'
            $kompyDSN: '%env(KOMPY_DB_DSN)%'
            $kompyDbPrefix: '%env(KOMPY_DB_PREFIX)%'

            $doctrineDSN: '%env(DOCTRINE_DSN)%'
            $doctrineUser: '%env(DOCTRINE_USER)%'
            $doctrinePassword: '%env(DOCTRINE_PASSWORD)%'

            $pymLegacyDSN: '%env(PYM_LEGACY_DB_DSN)%'
            $pymLegacyUser: '%env(PYM_LEGACY_DB_USER)%'
            $pymLegacyDbPrefix: '%env(PYM_LEGACY_DB_PREFIX)%'
            $pymLegacyPassword: '%env(PYM_LEGACY_DB_PASSWORD)%'

            $aquaDatabase: '@aquaDatabase'
            $doctrineDatabase: '@doctrineDatabase'
            $kompyDatabase: '@kompyDatabase'

            $debugCarrierRequest: '%env(bool:DEBUG_CARRIER_REQUEST)%'

            $shippedOS: '%env(int:SHIPPED_OS)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    _instanceof:
        App\Shared\Infrastructure\Database\Factory\DatabaseFactoryInterface:
            tags: ['kpy.database_factory']

    # si queremos inyectar una instancia de Database para Aqua, Symfony usara el factory para crear la instancia
    aquaDatabaseRoot:
        class: App\Shared\Infrastructure\Database\Database
        factory: [ '@App\Shared\Infrastructure\Database\Factory\DatabaseAquaFactory', 'create' ]

    aquaDatabase:
        class: App\Shared\Infrastructure\Database\Decorator\DatabaseLoggerDecorator
        arguments:
            $database: '@aquaDatabaseRoot'
            $databaseName: '%env(AQUA_DATABASE)%'
            $type: !php/const App\Shared\Infrastructure\Database\DatabaseType::SQLServer


    kompyDatabaseRoot:
        class: App\Shared\Infrastructure\Database\Database
        factory: ['@App\Shared\Infrastructure\Database\Factory\DatabaseKompyFactory', 'create']

    kompyDatabaseLogger:
        class: App\Shared\Infrastructure\Database\Decorator\DatabaseLoggerDecorator
        arguments:
            $database: '@kompyDatabaseRoot'
            $databaseName: '%env(KOMPY_DB_NAME)%'
            $type: !php/const App\Shared\Infrastructure\Database\DatabaseType::MySQL

    kompyDatabase:
        class: App\Shared\Infrastructure\Database\Decorator\DatabasePrefixerDecorator
        arguments:
            $database: '@kompyDatabaseLogger'
            $dbPrefix: '%env(KOMPY_DB_PREFIX)%'


    doctrineDatabaseRoot:
        class: App\Shared\Infrastructure\Database\Database
        factory: ['@App\Shared\Infrastructure\Database\Factory\DatabaseDoctrine', 'create']

    doctrineDatabase:
        class: App\Shared\Infrastructure\Database\Decorator\DatabaseLoggerDecorator
        arguments:
            $database: '@doctrineDatabaseRoot'
            $databaseName: '%env(DOCTRINE_DB)%'
            $type: !php/const App\Shared\Infrastructure\Database\DatabaseType::MySQL


    pymLegacyDatabaseRoot:
        class: App\Shared\Infrastructure\Database\Database
        factory: [ '@App\Shared\Infrastructure\Database\Factory\DatabasePymLegacyFactory', 'create' ]

    pymLegacyDatabaseLogger:
        class: App\Shared\Infrastructure\Database\Decorator\DatabaseLoggerDecorator
        arguments:
            $database: '@pymLegacyDatabaseRoot'
            $databaseName: '%env(PYM_LEGACY_DB_NAME)%'
            $type: !php/const App\Shared\Infrastructure\Database\DatabaseType::MySQL

    pymLegacyDatabase:
        class: App\Shared\Infrastructure\Database\Decorator\DatabasePrefixerDecorator
        arguments:
            $database: '@pymLegacyDatabaseLogger'
            $dbPrefix: '%env(PYM_LEGACY_DB_PREFIX)%'


    App\Shared\Infrastructure\Database\DatabaseBus:
        arguments:
            - !tagged_iterator kpy.database_factory

    App\ShippingCostCalculator\Infrastructure\Persistence\Repository\RangeRepository:
        arguments:
            $aquaDatabase: '@aquaDatabase'

    App\Warehouse\Domain\Carrier\MRW\Cordoba:
        class: App\Warehouse\Domain\Carrier\MRW\MRW
        arguments:
            $franquicia: '%env(MRW_CORDOBA_FRANQUICIA)%'
            $abonado: '%env(MRW_CORDOBA_ABONADO)%'
            $user: '%env(MRW_CORDOBA_USER)%'
            $password: '%env(MRW_CORDOBA_PASSWORD)%'
        tags:
            - { name: 'kpy.warehouse.carrier', key: 'mrw_cordoba'}

    App\Warehouse\Domain\Carrier\MRW\Viladecans:
        class: App\Warehouse\Domain\Carrier\MRW\MRW
        arguments:
            $franquicia: '%env(MRW_VILADECANS_FRANQUICIA)%'
            $abonado: '%env(MRW_VILADECANS_ABONADO)%'
            $user: '%env(MRW_VILADECANS_USER)%'
            $password: '%env(MRW_VILADECANS_PASSWORD)%'
        tags:
            - { name: 'kpy.warehouse.carrier', key: 'mrw_viladecans' }

    App\Warehouse\Domain\Carrier\MRW\Jaen:
        class: App\Warehouse\Domain\Carrier\MRW\MRW
        arguments:
            $franquicia: '%env(MRW_JAEN_FRANQUICIA)%'
            $abonado: '%env(MRW_JAEN_ABONADO)%'
            $user: '%env(MRW_JAEN_USER)%'
            $password: '%env(MRW_JAEN_PASSWORD)%'
        tags:
            - { name: 'kpy.warehouse.carrier', key: 'mrw_jaen' }

    # siempre que un servicio requiere la interfaz GooglePublicApiInterface se inyectará la clase GooglePublicApi
    App\Google\Infrastructure\API\GooglePublicApi: ~
    App\Google\Infrastructure\API\GooglePublicApiInterface: '@App\Google\Infrastructure\API\GooglePublicApi'

    App\Priceshape\Infrastructure\API\PriceshapePublicApi: ~
    App\Priceshape\Infrastructure\API\PriceshapePublicApiInterface: '@App\Priceshape\Infrastructure\API\PriceshapePublicApi'

    App\Shared\Infrastructure\API\KpyPublicApi: ~
    App\Shared\Infrastructure\API\KpyPublicApiInterface: '@App\Shared\Infrastructure\API\KpyPublicApi'

    App\Warehouse\Infrastructure\API\WarehousePublicApi: ~
    App\Warehouse\Infrastructure\API\WarehousePublicApiInterface: '@App\Warehouse\Infrastructure\API\WarehousePublicApi'
